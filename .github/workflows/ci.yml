name: CI

# Gate de qualidade: lint + typecheck + testes (com cobertura) + build em cada PR/push.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # Mesmo npm da máquina de desenvolvimento (Node 24 / npm 11). Com o npm 10
      # do Node 22, um lock gerado pelo npm 11 falha no npm ci (dependências
      # opcionais do driver do mongodb) — foi o que deixou o CI vermelho em 16/11.
      - name: npm 11
        run: npm install -g npm@11

      - name: Install (root + client + server)
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      # (S12) Auditoria de dependências — bloqueia publicação se houver
      # vulnerabilidade >= high em qualquer workspace (root / client / server).
      # Para falsos positivos pontuais, use `npm audit --audit-level=critical`
      # ou adicione uma exceção em .nsprc / overrides no package.json.
      - name: Security audit (npm)
        run: |
          echo "::group::root"  && npm audit --audit-level=high; echo "::endgroup::"
          echo "::group::client" && npm audit --audit-level=high --prefix client; echo "::endgroup::"
          echo "::group::server" && npm audit --audit-level=high --prefix server; echo "::endgroup::"

      # O portão completo (scripts/qualidade/check.mjs): tipos, lint, build,
      # testes com cobertura (server, client e scripts), duplicação,
      # dependências e catraca contra docs/metricas.json. O build vem antes dos
      # testes do server porque tests/app_shell_contract.spec.js lê client/dist.
      # O e2e roda no job próprio abaixo. Os logs de cada etapa ficam no
      # artefato "portao-logs".
      - name: Portão (npm run check, sem e2e)
        run: npm run check -- --sem-e2e

      - name: Upload logs do portão
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portao-logs
          path: .qualidade/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cobertura backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: server/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload cobertura frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: client/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build server (validação de sintaxe)
        run: npm run build:server

  e2e:
    name: e2e (Playwright)
    # Fixado: `ubuntu-latest` virou 26.04 e o Playwright 1.60 não instala o
    # Chromium nele ("does not support chromium on ubuntu26.04-x64"). Voltar
    # para latest junto com um upgrade do Playwright que suporte a imagem nova.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # Mesmo npm da máquina de desenvolvimento (Node 24 / npm 11). Com o npm 10
      # do Node 22, um lock gerado pelo npm 11 falha no npm ci (dependências
      # opcionais do driver do mongodb) — foi o que deixou o CI vermelho em 16/11.
      - name: npm 11
        run: npm install -g npm@11

      - name: Install (root + client + server)
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      # (2.6) Navegador do Playwright + libs do sistema (ubuntu).
      - name: Install Playwright browser (chromium)
        run: npm run test:e2e:install --prefix client

      # O webServer do playwright.config.ts faz `npm run build && npm run preview`
      # e o teste intercepta /api no browser — sem MongoDB/Express envolvidos.
      - name: Run E2E (Playwright)
        run: npm run test:e2e --prefix client

      - name: Upload relatório E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
